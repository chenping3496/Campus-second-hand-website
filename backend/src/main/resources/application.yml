spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://localhost:3306/ershou?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  web:
    resources:
      static-locations: classpath:/static/,file:src/main/resources/static/
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
      timeout: 3000ms
  rabbitmq:
    # 开启后通知/订单事件/离线聊天走 MQ 异步处理（简历所述 4 消费者架构）。
    # 本地无 Broker 时设为 false，自动回退到同步通知，功能不丢。
    enabled: true
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        # auto：消费者抛出的异常由 Spring 统一处理（重试 → 耗尽后进死信队列）。
        # 不再用 manual + basicNack(requeue=true)，避免毒消息无限重投。
        acknowledge-mode: auto
        prefetch: 1
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
        # 重试耗尽后不再 requeue，按队列上 x-dead-letter-exchange 路由到死信队列
        default-requeue-rejected: false

server:
  port: 8081

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-enums-package: com.example.backend.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: ershou-platform-secret-key-2024-very-long-secret-key-for-jwt-token
  expiration: 86400000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

cache:     #缓存抽象框架
  ttl:
    category: 3600000
    product-detail: 1800000
    user-session: 86400000
    hot-products: 300000

spring:
  websocket:
    max-text-message-buffer-size: 81920 # 80KB缓冲区
    max-binary-message-buffer-size: 81920

chat:
  websocket:
    heartbeat-interval-ms: 30000  # 30秒心跳间隔
    heartbeat-timeout-ms: 90000  # 90秒心跳超时
    message-ack-timeout-ms: 30000  # 30秒消息ACK超时
    max-retry-count: 3  # 最大重试次数
    connection-limit:
      per-instance: 5000  # 单实例最大连接数
      per-user: 10  # 单用户最大连接数

  inventory:
    reserve-timeout-seconds: 300  # 预扣库存超时时间（5分钟）
    sync-interval-seconds: 60  # 库存同步间隔（1分钟）

monitoring:
  websocket:
    enabled: true
    metrics-endpoint: "/admin/websocket/metrics"
    health-endpoint: "/admin/websocket/health"
    alert-thresholds:
      connections: 80  # 连接数超过80%告警
      error-rate: 5.0  # 错误率超过5%告警
